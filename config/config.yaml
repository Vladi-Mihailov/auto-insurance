# Non-secret structural configuration for auto-insurance.
# Secrets (payment requisites, cookie key, DB path override) live in .env — see .env.example.
#
# Prices are RUB (whole rubles); converted to minor units (kopecks) in code.
# Do NOT hardcode prices in templates/handlers — always read them from here.
#
# Periods here (15d/30d/90d) match tpl.ge's Georgia product structure —
# see app/dates/rules.py for the date-math and app/catalog/ for vehicle
# categories/manufacturers/models (all synced from tpl.ge, not hand-typed).
#
# price_rub: null means "period exists, price NOT YET CONFIGURED" — the
# checkout must show this as configuration-required, never guess a number.
#
# 1-year (1y) is INTENTIONALLY ABSENT, not just unpriced: we cannot sell a
# 1-year policy at all right now, so it must not exist as a selectable (or
# even disabled/"price uncertain") period for any category. Do not re-add a
# "1y" entry anywhere below without a product decision to actually sell it
# again — app.dates.rules.GeorgiaDateRule still supports the 1y date-math
# for legacy orders/resume, which is unaffected by this config.
#
# 15d/30d/90d RUB prices below were confirmed by business on 2026-08-13.

pricing:
  GE:
    passenger_car:
      - code: "15d"
        label: "15 дней"
        price_rub: 1349
      - code: "30d"
        label: "30 дней"
        price_rub: 2149
      - code: "90d"
        label: "90 дней"
        price_rub: 3649
    # Motorcycle RUB tariffs confirmed by business on 2026-08-13. tpl.ge
    # research (same date) confirmed motorcycle reuses passenger_car's exact
    # checkout flow/vehicle-fields/catalog with no category-specific code
    # needed -- see the research report for evidence. 1y intentionally
    # absent, same rule as passenger_car above.
    motorcycle:
      - code: "15d"
        label: "15 дней"
        price_rub: 1059
      - code: "30d"
        label: "30 дней"
        price_rub: 1549
      - code: "90d"
        label: "90 дней"
        price_rub: 2899
    # Trailer RUB tariffs confirmed by business on 2026-08-13. tpl.ge research
    # (same date) confirmed trailer's checkout flow/vehicle-fields/catalog are
    # identical to passenger_car/motorcycle -- no category-specific code
    # needed. 1y intentionally absent, same rule as above.
    trailer:
      - code: "15d"
        label: "15 дней"
        price_rub: 849
      - code: "30d"
        label: "30 дней"
        price_rub: 1249
      - code: "90d"
        label: "90 дней"
        price_rub: 1799
    # Bus RUB tariffs confirmed by business on 2026-08-13 as INDEPENDENT
    # fixed tariffs -- NOT derived from passenger_car (no multiplier/formula)
    # and must not change automatically if passenger_car pricing changes.
    # tpl.ge research (same date) confirmed bus's checkout flow/vehicle-
    # fields/catalog are identical to passenger_car/motorcycle/trailer, and
    # that tpl.ge itself performs no passenger-seat-count (or any other
    # bus-defining) validation anywhere in its checkout -- see the research
    # report. 1y intentionally absent, same rule as above.
    bus:
      - code: "15d"
        label: "15 дней"
        price_rub: 1999
      - code: "30d"
        label: "30 дней"
        price_rub: 3199
      - code: "90d"
        label: "90 дней"
        price_rub: 5449
    # Truck RUB tariffs confirmed by business on 2026-08-13 as INDEPENDENT
    # fixed tariffs -- NOT a passenger_car*2 formula (that was only an early
    # reference point, not the final rule) and must not change automatically
    # if passenger_car pricing changes. tpl.ge research (same date) confirmed
    # truck's checkout flow/vehicle-fields/catalog are identical to the other
    # categories above, and that tpl.ge itself performs no mass/axle/body-
    # type validation anywhere in its checkout. 1y intentionally absent,
    # same rule as above.
    truck:
      - code: "15d"
        label: "15 дней"
        price_rub: 2699
      - code: "30d"
        label: "30 дней"
        price_rub: 4299
      - code: "90d"
        label: "90 дней"
        price_rub: 7299
    # special_vehicle RUB tariffs confirmed by business on 2026-08-13 as its
    # OWN independent product tariffs -- these currently happen to equal
    # passenger_car's numbers, but that is a coincidence, not a dependency:
    # this is a separate config block with its own literal values, never a
    # fallback/reference/multiplier tied to passenger_car. If passenger_car
    # pricing changes later, special_vehicle must NOT change automatically.
    # tpl.ge research (same date) confirmed special_vehicle's checkout flow/
    # vehicle-fields/catalog are identical to the other categories above,
    # and that tpl.ge itself performs no equipment-type/purpose validation
    # anywhere in its checkout. 1y intentionally absent, same rule as above.
    special_vehicle:
      - code: "15d"
        label: "15 дней"
        price_rub: 1349
      - code: "30d"
        label: "30 дней"
        price_rub: 2149
      - code: "90d"
        label: "90 дней"
        price_rub: 3649

# country -> which internal vehicle_category_code values are enabled for that
# country's checkout (see app.catalog.repository.list_categories's
# allowed_codes param). A country absent here (Georgia) is UNRESTRICTED --
# every category the catalog has stays exactly as it is today. AM/TR are
# deliberately narrowed to passenger_car only for now: this is an MVP scope
# limit (their engine-power/duration/pricing data for other categories isn't
# confirmed yet -- see the GE/AM/TR gap-analysis report), NOT a claim that
# motorcycle/trailer/truck/bus/special_vehicle aren't insurable in Armenia or
# Turkey. Add more codes here later; no checkout/route code changes needed.
catalog:
  enabled_category_codes_by_country:
    AM: ["passenger_car"]
    TR: ["passenger_car"]
