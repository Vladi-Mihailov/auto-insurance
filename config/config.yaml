# Non-secret structural configuration for auto-insurance.
# Secrets (payment requisites, cookie key, DB path override) live in .env — see .env.example.
#
# Prices are RUB (whole rubles); converted to minor units (kopecks) in code.
# Do NOT hardcode prices in templates/handlers — always read them from here.
#
# Periods here (15d/30d/90d) match tpl.ge's Georgia product structure —
# see app/dates/rules.py for the date-math and app/catalog/ for vehicle
# categories/manufacturers/models (all synced from tpl.ge, not hand-typed).
#
# price_rub: null means "period exists, price NOT YET CONFIGURED" — the
# checkout must show this as configuration-required, never guess a number.
#
# 1-year (1y) is INTENTIONALLY ABSENT, not just unpriced: we cannot sell a
# 1-year policy at all right now, so it must not exist as a selectable (or
# even disabled/"price uncertain") period for any category. Do not re-add a
# "1y" entry anywhere below without a product decision to actually sell it
# again — app.dates.rules.GeorgiaDateRule still supports the 1y date-math
# for legacy orders/resume, which is unaffected by this config.
#
# 15d/30d/90d RUB prices below were confirmed by business on 2026-08-13.

pricing:
  GE:
    passenger_car:
      - code: "15d"
        label: "15 дней"
        price_rub: 1349
      - code: "30d"
        label: "30 дней"
        price_rub: 2149
      - code: "90d"
        label: "90 дней"
        price_rub: 3649
    # Motorcycle RUB tariffs confirmed by business on 2026-08-13. tpl.ge
    # research (same date) confirmed motorcycle reuses passenger_car's exact
    # checkout flow/vehicle-fields/catalog with no category-specific code
    # needed -- see the research report for evidence. 1y intentionally
    # absent, same rule as passenger_car above.
    motorcycle:
      - code: "15d"
        label: "15 дней"
        price_rub: 1059
      - code: "30d"
        label: "30 дней"
        price_rub: 1549
      - code: "90d"
        label: "90 дней"
        price_rub: 2899
    # Trailer RUB tariffs confirmed by business on 2026-08-13. tpl.ge research
    # (same date) confirmed trailer's checkout flow/vehicle-fields/catalog are
    # identical to passenger_car/motorcycle -- no category-specific code
    # needed. 1y intentionally absent, same rule as above.
    trailer:
      - code: "15d"
        label: "15 дней"
        price_rub: 849
      - code: "30d"
        label: "30 дней"
        price_rub: 1249
      - code: "90d"
        label: "90 дней"
        price_rub: 1799
    # Bus RUB tariffs confirmed by business on 2026-08-13 as INDEPENDENT
    # fixed tariffs -- NOT derived from passenger_car (no multiplier/formula)
    # and must not change automatically if passenger_car pricing changes.
    # tpl.ge research (same date) confirmed bus's checkout flow/vehicle-
    # fields/catalog are identical to passenger_car/motorcycle/trailer, and
    # that tpl.ge itself performs no passenger-seat-count (or any other
    # bus-defining) validation anywhere in its checkout -- see the research
    # report. 1y intentionally absent, same rule as above.
    bus:
      - code: "15d"
        label: "15 дней"
        price_rub: 1999
      - code: "30d"
        label: "30 дней"
        price_rub: 3199
      - code: "90d"
        label: "90 дней"
        price_rub: 5449
    # Truck RUB tariffs confirmed by business on 2026-08-13 as INDEPENDENT
    # fixed tariffs -- NOT a passenger_car*2 formula (that was only an early
    # reference point, not the final rule) and must not change automatically
    # if passenger_car pricing changes. tpl.ge research (same date) confirmed
    # truck's checkout flow/vehicle-fields/catalog are identical to the other
    # categories above, and that tpl.ge itself performs no mass/axle/body-
    # type validation anywhere in its checkout. 1y intentionally absent,
    # same rule as above.
    truck:
      - code: "15d"
        label: "15 дней"
        price_rub: 2699
      - code: "30d"
        label: "30 дней"
        price_rub: 4299
      - code: "90d"
        label: "90 дней"
        price_rub: 7299
    # special_vehicle RUB tariffs confirmed by business on 2026-08-13 as its
    # OWN independent product tariffs -- these currently happen to equal
    # passenger_car's numbers, but that is a coincidence, not a dependency:
    # this is a separate config block with its own literal values, never a
    # fallback/reference/multiplier tied to passenger_car. If passenger_car
    # pricing changes later, special_vehicle must NOT change automatically.
    # tpl.ge research (same date) confirmed special_vehicle's checkout flow/
    # vehicle-fields/catalog are identical to the other categories above,
    # and that tpl.ge itself performs no equipment-type/purpose validation
    # anywhere in its checkout. 1y intentionally absent, same rule as above.
    special_vehicle:
      - code: "15d"
        label: "15 дней"
        price_rub: 1349
      - code: "30d"
        label: "30 дней"
        price_rub: 2149
      - code: "90d"
        label: "90 дней"
        price_rub: 3649

  # Turkey: FIXED-PERIOD product (unlike Armenia's exact-date-range one
  # below), same shape as Georgia's own pricing lists -- see
  # app.dates.rules.FixedDurationDateRule for the date math. Unlike GE/AM,
  # every period here uses price_tl (not price_rub): business confirmed on
  # 2026-09-06 that Turkey's real source of truth is strahovka-turkiye.com's
  # own TL tariffs, converted to RUB via tr_tl_conversion below (see
  # app.pricing.provider.available_periods, the only consumer of price_tl).
  # Each category ONLY lists the periods strahovka-turkiye.com itself
  # actually offers for that vehicle type -- e.g. passenger_car has all
  # five periods, but motorcycle has no 45d, and truck/special_vehicle only
  # have 30d/90d. This is deliberate: the source simply doesn't sell those
  # combinations, so we don't invent a period (priced or unpriced) to force
  # a uniform UI across categories -- see app.web.checkout_routes'
  # category-period screen, which already renders whatever period set
  # available_periods() returns per category, no fixed-shape assumption.
  #
  # bus and trailer are INTENTIONALLY ABSENT here (and from
  # catalog.enabled_category_codes_by_country.TR below) -- the source has no
  # confirmed tariff for either, so they are not offered at all, not offered
  # unpriced. Do not add them without a real source tariff.
  #
  # Category mapping from the source's own classification (confirmed
  # 2026-09-06, NOT a code-level assumption -- see the category-mapping
  # research): "Легковое авто" -> passenger_car, "Мотоцикл" -> motorcycle,
  # "Kamyonet" -> truck, "Karavan" -> special_vehicle. Kamyonet is actually a
  # light-commercial-vehicle bucket (van/minibus/pickup) and Karavan is a
  # self-propelled motorhome (not a towed trailer) -- both are looser
  # matches than GE's own category definitions, accepted as the closest
  # available mapping, not a literal equivalence.
  TR:
    passenger_car:
      - code: "30d"
        label: "30 дней"
        price_tl: 750
      - code: "45d"
        label: "45 дней"
        price_tl: 1000
      - code: "90d"
        label: "90 дней"
        price_tl: 1250
      - code: "180d"
        label: "180 дней"
        price_tl: 5100
      - code: "365d"
        label: "365 дней"
        price_tl: 7500
    # motorcycle: 45d not offered by the source at all -- absent, not null.
    motorcycle:
      - code: "30d"
        label: "30 дней"
        price_tl: 750
      - code: "90d"
        label: "90 дней"
        price_tl: 1000
      - code: "180d"
        label: "180 дней"
        price_tl: 1500
      - code: "365d"
        label: "365 дней"
        price_tl: 2500
    # truck <- source's "Kamyonet" (see mapping note above). Only 30d/90d
    # offered by the source.
    truck:
      - code: "30d"
        label: "30 дней"
        price_tl: 1100
      - code: "90d"
        label: "90 дней"
        price_tl: 1600
    # special_vehicle <- source's "Karavan" (see mapping note above). Only
    # 30d/90d offered by the source.
    special_vehicle:
      - code: "30d"
        label: "30 дней"
        price_tl: 3100
      - code: "90d"
        label: "90 дней"
        price_tl: 4200

# Turkey-only TL->RUB conversion for pricing.TR's price_tl periods above --
# see app.settings.TrTlConversionConfig and
# app.pricing.provider.available_periods (which additionally requires
# country_code == "TR" before ever using this, not just "a period happens to
# have price_tl"). rate is a MANUAL config value confirmed by business on
# 2026-09-06 -- no external FX API integration; update this one number by
# hand to reprice every TR period, GE/AM are structurally unaffected since
# neither uses price_tl at all. final RUB = round_to_nearest_X99(price_tl *
# rate + markup_rub) -- see app.pricing.provider._round_to_nearest_x99 for
# the exact rounding rule (ties round up).
tr_tl_conversion:
  rate: "1.80"
  markup_rub: 600

# country -> which internal vehicle_category_code values are enabled for that
# country's checkout (see app.catalog.repository.list_categories's
# allowed_codes param). A country absent here (Georgia) is UNRESTRICTED --
# every category the catalog has stays exactly as it is today. TR is now
# open for the four categories with a confirmed source tariff (business
# confirmed 2026-09-06); bus/trailer stay excluded until a source tariff for
# them is confirmed -- see pricing.TR's own comment above. AM is open for
# all six categories (business confirmed 2026-09-06 that Armenia's tariff
# grid is literally Georgia's own, per category -- see duration_ranges.AM
# below). Add more codes here later; no checkout/route code changes needed.
catalog:
  enabled_category_codes_by_country:
    AM: ["passenger_car", "motorcycle", "bus", "truck", "trailer", "special_vehicle"]
    TR: ["passenger_car", "motorcycle", "truck", "special_vehicle"]

# country -> vehicle_category_code -> {min_days, max_days} -- EXACT DATE
# RANGE products (currently only Armenia's foreign-vehicle CMTPL, per the
# gap-analysis report: 10-day minimum, confirmed by law HO-63-N Art. 6.2 +
# Nairi Insurance + the State Revenue Committee's border guide; 365-day
# maximum, same ceiling as domestic policies -- same for every category,
# not category-specific). A (country, category) pair here must NOT also
# appear under pricing.<country>.<category> above -- it's one product model
# or the other, never both (see app.pricing.provider.get_duration_range,
# checked before available_periods everywhere this matters).
#
# pricing (linear daily price + percent discount): business confirmed on
# 2026-09-06 that Armenia's tariff grid is LITERALLY Georgia's own tariff
# grid for the corresponding category -- reference_price_rub_1/2 below are
# copied directly from this same file's pricing.GE.<category> 15d/30d
# entries, no markup, no separate AM business data. Two reference points
# define a straight RUB-per-day line, applied across the FULL 10-365 day
# range -- every individual day count is computed from the formula, never
# bucketed into brackets, and days outside 15-30 are intentionally
# extrapolated, not rejected. See app.pricing.provider.resolve_duration_price
# for the exact rounding order (base price rounded first, then discount
# applied and rounded again; ROUND_HALF_UP; Decimal/Fraction only, never
# float). discount_percent: 0 means no discount is currently active.
# default_duration_days pre-fills end_date on the FIRST view of a fresh
# /date draft only (start_date + this many days) -- see
# app.web.checkout_routes.get_date_step. Never overwrites dates a customer
# already chose, and has no bearing on the min_days/max_days validation
# above, which stays enforced exactly as before regardless of this default.
duration_ranges:
  AM:
    passenger_car:
      min_days: 10
      max_days: 365
      default_duration_days: 15
      pricing:
        reference_days_1: 15
        reference_price_rub_1: 1349
        reference_days_2: 30
        reference_price_rub_2: 2149
    motorcycle:
      min_days: 10
      max_days: 365
      default_duration_days: 15
      pricing:
        reference_days_1: 15
        reference_price_rub_1: 1059
        reference_days_2: 30
        reference_price_rub_2: 1549
    bus:
      min_days: 10
      max_days: 365
      default_duration_days: 15
      pricing:
        reference_days_1: 15
        reference_price_rub_1: 1999
        reference_days_2: 30
        reference_price_rub_2: 3199
    truck:
      min_days: 10
      max_days: 365
      default_duration_days: 15
      pricing:
        reference_days_1: 15
        reference_price_rub_1: 2699
        reference_days_2: 30
        reference_price_rub_2: 4299
    trailer:
      min_days: 10
      max_days: 365
      default_duration_days: 15
      pricing:
        reference_days_1: 15
        reference_price_rub_1: 849
        reference_days_2: 30
        reference_price_rub_2: 1249
    # special_vehicle's reference prices happen to equal passenger_car's --
    # GE's own config for this category carries the identical note: a
    # coincidence in the confirmed business tariffs, not a
    # formula/reference/multiplier tied to passenger_car. Kept as its own
    # independent block for that reason, not an alias.
    special_vehicle:
      min_days: 10
      max_days: 365
      default_duration_days: 15
      pricing:
        reference_days_1: 15
        reference_price_rub_1: 1349
        reference_days_2: 30
        reference_price_rub_2: 2149
        discount_percent: 0
